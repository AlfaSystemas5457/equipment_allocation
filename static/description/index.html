<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Odoo - Asignación de equipos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <section class="container py-5">
        <div class="text-center">
            <h1 class="fw-bold text-primary">Asignación de equipos</h1>
            <p class="lead">Agrega una forma de realizar asignacipones de los equipos disponibles.</p>
        </div>

        <div class="row justify-content-center my-4">
            <div class="col-md-8 text-center">
                <h2 class="fw-semibold text-info">Compatible con Odoo Community y Enterprise</h2>
                <h3 class="fw-semibold text-muted">12.0, 18.0 y 19.0</h3>
            </div>
        </div>

        <div class="row justify-content-center my-4">
            <div class="col-md-6 text-center d-flex align-items-center justify-content-center">
                <a href="https://github.com/AlfaSystemas5457/equipment_allocation" target="_blank"
                    class="btn btn-primary btn-github btn-lg d-flex align-items-center p-2" style="width: fit-content;">
                    <img src="./assets/github.svg" alt="github" style="width: 30px; height: 30px; margin-right: 10px;">
                    <span class="fs-4">Ver en GitHub</span>
                </a>
            </div>
        </div>

        <div class="row justify-content-center my-5">
            <div class="col-md-8">
                <h2 class="fw-semibold text-dark">Vista previa de la asignación</h2>
                <div class="text-center">
                    <img src="./assets/Asignación de equipos.png" alt="Vista de la asignación"
                        class="img-fluid rounded shadow">
                </div>
            </div>
        </div>

        <div class="row justify-content-center my-5">
            <div class="col-md-8">
                <h2 class="fw-semibold text-dark">Vista previa del reemplazo</h2>
                <div class="text-center">
                    <img src="./assets/Reemplazo de equipo.png" alt="Reemplazo de equipo"
                        class="img-fluid rounded shadow">
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
